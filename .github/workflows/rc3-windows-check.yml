name: IRON RC3 Windows check

# RC3 HWiNFO REST 검증 도구(stage2-rc3/)의 Windows 호환성 확인 전용. 모의 HWiNFO 서버(SYNTHETIC)만 사용하며
# 실제 하드웨어 측정이 아니다. main·feat/iron-ui-stage1·기존 ci.yml과 무관하고 이 임시 브랜치에서만 실행된다.
on:
  push:
    branches:
      - "rc3/windows-ci-check"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc3-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows - PowerShell 5.1/7 collector, C# PoC (mock HWiNFO)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: stage2-rc3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: User locale ko-KR (same as the IRON PC)
        run: |
          Set-Culture ko-KR
          python --version
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Build PoC (TreatWarningsAsErrors)
        run: dotnet build poc/HWiNfoRestPoC.csproj -c Release -o "${{ runner.temp }}/poc"

      - name: Main suite (PS 5.1 + 7 collector, PoC selftest/live, normal/error/disconnect/reconnect)
        run: python -I tests/windows_ci_check.py --suite main --out "${{ runner.temp }}/ci-out" --poc "${{ runner.temp }}/poc/HWiNfoRestPoC.dll"

      - name: User locale de-DE (decimal comma)
        if: ${{ !cancelled() }}
        run: Set-Culture de-DE

      - name: Culture suite (JSON numbers and G1 under de-DE)
        if: ${{ !cancelled() }}
        run: python -I tests/windows_ci_check.py --suite culture --out "${{ runner.temp }}/ci-out" --poc "${{ runner.temp }}/poc/HWiNfoRestPoC.dll"

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc3-windows-check
          path: ${{ runner.temp }}/ci-out
          retention-days: 14
