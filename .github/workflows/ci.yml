name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

# Test steps run after a successful build even when an earlier test step failed, so every run reports all results
# (the job still fails if any step failed).
jobs:
  linux:
    name: Linux - build (incl. WPF compile), module regression tests, integration tests
    # Pinned: A, B, C and E were validated on Ubuntu 24.04 (ICU 74). On ubuntu-latest = 26.04 (newer ICU), C's test
    # Event_6008_localized_time_is_parsed_only_when_plausible fails because ko-KR date parsing changed; the same test
    # passes on the Windows job. Recorded in docs/VERIFICATION.md (known issue of C, not changed by the integration).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Import manifest (modified/added files vs. the pinned A, B, C, E commits)
        run: python3 scripts/module-manifest.py verify

      - name: XAML resources found while views load (module keys, shared converters)
        run: python3 scripts/xaml-resource-check.py

      - name: Build
        id: build
        run: dotnet build PcControlCenter.slnx -c Release

      - name: A regression tests (Local AI Performance Center)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project modules/local-ai-performance-center/tests/LocalAiPerf.Tests -c Release --no-build

      - name: B regression tests (GPU Profit & Compute Center)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project modules/gpu-profit-center/tests/GpuProfit.Tests -c Release --no-build

      - name: C regression tests (Windows Diagnostics Lab)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project modules/windows-diagnostics-lab/tests/WinDiag.Tests -c Release --no-build

      - name: E regression tests (Windows AI Operator)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project modules/windows-ai-operator/tests/WindowsAiOperator.Tests -c Release --no-build

      - name: Integration tests (shared sensor, modules, shell, data)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/PcControlCenter.Tests -c Release --no-build

  windows:
    name: Windows x64 - build, all tests, real UIA tests, portable package, GUI smoke tests
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        id: build
        run: dotnet build PcControlCenter.slnx -c Release

      - name: A regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: dotnet test --project modules/local-ai-performance-center/tests/LocalAiPerf.Tests -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: B regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: dotnet test --project modules/gpu-profit-center/tests/GpuProfit.Tests -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: C regression tests (incl. Windows event log integration)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: dotnet test --project modules/windows-diagnostics-lab/tests/WinDiag.Tests -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: E regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: dotnet test --project modules/windows-ai-operator/tests/WindowsAiOperator.Tests -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: E real UI Automation tests (test app and Notepad on the runner desktop)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: dotnet test --project modules/windows-ai-operator/tests/WindowsAiOperator.UiaTests -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: dotnet test --project tests/PcControlCenter.Tests -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Publish portable package (self-contained single-file EXE)
        id: publish
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/publish.ps1 -OutputDir dist

      - name: GUI smoke tests (published EXE - mock, real sensors without GPU, recovery after kill)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/smoke-gui.ps1 -Exe dist/PcControlCenter-win-x64/PcControlCenter.exe -ReportDir dist/smoke

      - name: Upload portable package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PcControlCenter-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Upload smoke test evidence (screenshots, JSON reports, logs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-evidence
          path: dist/smoke
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: warn
          retention-days: 30
